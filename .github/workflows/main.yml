name: Sync to Hugging Face Hub

on:
push:
branches: [main]
workflow_dispatch:

jobs:
sync-to-hub:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Add Hugging Face remote
    env:
      HF: ${{ secrets.HG }}
    run: |
      git remote add space https://kaushal1508:$HF@huggingface.co/spaces/kaushal1508/huggingdemo

  - name: Push to Hugging Face Hub
    env:
      HF: ${{ secrets.HG }}
    run: |
      git push --force https://kaushal1508:$HF@huggingface.co/spaces/kaushal1508/huggingdemo main
```

      
      
      
      
      

